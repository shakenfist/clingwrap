[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[simple]>=6.2",
    "wheel",
    "build",
    "twine"
]
build-backend = "setuptools.build_meta"

[project]
name = "clingwrap"
dynamic = ["version"]

description = "Build bundles of debugging information for system crashes"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "oslo.concurrency",     # apache2
    "click>=7.1.1",         # bsd
    "pyyaml",               # mit
]

[project.urls]
"Homepage" = "https://shakenfist.com"
"Bug Tracker" = "https://github.com/shakenfist/clingwrap/issues"

[project.scripts]
clingwrap = "clingwrap.main:cli"

# The tests must not ship. The exclude below drops them as a package, but
# include-package-data defaults to true under pyproject.toml and
# setuptools_scm's file finder offers every git-tracked file as package
# data, so they would come straight back as data without this. The only
# data read at runtime is examples/*.cwd, loaded through importlib.resources
# by "clingwrap gather --target <name>", and the package-data entry below
# names it explicitly.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["clingwrap*"]
exclude = ["clingwrap.tests*"]

[tool.setuptools.package-data]
clingwrap = [
    "examples/*.cwd"
]

[tool.setuptools_scm]
git_describe_command = "git describe --dirty --tags --match v* --first-parent"
write_to = "clingwrap/_version.py"

[project.optional-dependencies]
test = [
    "coverage",            # apache2
    "testtools",           # mit
    "mock",                # bsd
    "stestr",              # apache2
    "tox",                 # mit
    "flake8",              # mit
]
