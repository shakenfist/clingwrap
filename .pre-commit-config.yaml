repos:
  # Lints the agent context -- AGENTS.md and anything under .claude/ --
  # for malformed structure, smuggled unicode and pasted credentials.
  # Also run in CI, by the agent-context job in supply-chain.yml, since
  # a hook is skippable with --no-verify and by a clone that never ran
  # "pre-commit install". The rev here is the only place the version is
  # written down; CI runs this hook rather than invoking skillsaw
  # itself.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.22.0
    hooks:
      - id: skillsaw

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^tools/
        types_or: [sh, bash, shell]
        args: ['-x']
